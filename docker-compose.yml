services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mosquito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mosquito123}
      POSTGRES_DB: ${POSTGRES_DB:-mosquito}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 数据库不发布到宿主端口，仅 compose 内部网络访问

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 缓存不发布到宿主端口，仅 compose 内部网络访问

  app:
    build: .
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-mosquito}:${POSTGRES_PASSWORD:-mosquito123}@db:5432/${POSTGRES_DB:-mosquito}?sslmode=disable
      REDIS_ADDR: redis:6379
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
